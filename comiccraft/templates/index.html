<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - AI Comic Creator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at top,
                    rgba(120, 20, 30, 0.35),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #180609,
                    #2a080d 45%,
                    #100305
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 36px;
            letter-spacing: 2px;

            color: #fff;

            text-shadow:
                0 0 12px rgba(255, 60, 70, 0.35),
                0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .header p {
            margin-top: 10px;

            color: #d8bfc2;

            font-size: 15px;
            line-height: 1.5;
        }


        /* =========================
           MAIN CARD
           ========================= */

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(80, 15, 22, 0.72),
                    rgba(25, 5, 8, 0.86)
                );

            border: 1px solid rgba(255, 90, 100, 0.18);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 22px;

            padding: 26px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .card-title {
            font-size: 21px;
            font-weight: bold;

            margin-bottom: 22px;

            color: #fff;

            letter-spacing: 0.4px;
        }


        /* =========================
           FORM
           ========================= */

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

            color: #ead9db;

            letter-spacing: 0.3px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(255, 130, 140, 0.16);
            border-radius: 12px;

            background:
                rgba(8, 2, 4, 0.65);

            color: white;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #917b7f;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #d83b4b;

            background:
                rgba(15, 3, 6, 0.85);

            box-shadow:
                0 0 0 2px rgba(216, 59, 75, 0.12),
                0 0 18px rgba(216, 59, 75, 0.12);
        }

        select option {
            color: black;
        }


        /* =========================
           GENERATE BUTTON
           ========================= */

        .generate-button {
            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: 1px solid rgba(255, 150, 155, 0.18);
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #c92f40,
                    #7d101c
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(120, 10, 25, 0.35);

            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .generate-button:hover {
            filter: brightness(1.08);

            box-shadow:
                0 12px 30px rgba(180, 20, 35, 0.42);
        }

        .generate-button:active {
            transform: scale(0.98);
        }

        .generate-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }


        /* =========================
           FOOTER
           ========================= */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #8e7377;

            font-size: 12px;
        }


        /* =========================
           GENERATED COMIC
           ========================= */

        #comicResult {
            margin-top: 28px;
        }

        .comic-panel {
            margin-bottom: 25px;

            padding: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(75, 12, 20, 0.55),
                    rgba(10, 2, 4, 0.72)
                );

            border:
                1px solid rgba(255, 100, 110, 0.15);

            border-radius: 17px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .comic-panel h3 {
            margin-bottom: 13px;

            font-size: 19px;

            color: #fff;

            text-align: center;

            letter-spacing: 0.5px;
        }

        .comic-image {
            width: 100%;

            display: block;

            border-radius: 12px;

            margin-bottom: 16px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.4);
        }


        /* =========================
           STORY TEXT
           ========================= */

        .panel-text {
            margin-top: 10px;

            padding: 13px 14px;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.035);

            color: #dfd0d2;

            font-size: 15px;

            line-height: 1.55;

            text-align: left;

            white-space: normal;
            word-wrap: break-word;
        }

        .panel-text strong {
            display: block;

            margin-bottom: 6px;

            color: #fff;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            text-align: left;
        }

        .narration-box {
            border-left:
                3px solid #c92f40;
        }

        .dialogue-box {
            border-left:
                3px solid #8e1725;
        }


        /* =========================
           PDF DOWNLOAD
           ========================= */

        .download-button {
            display: block;

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #8f1725,
                    #4a080f
                );

            border:
                1px solid rgba(255, 110, 120, 0.18);

            color: white;

            text-align: center;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.35);

            transition:
                filter 0.2s ease,
                transform 0.15s ease;
        }

        .download-button:hover {
            filter: brightness(1.12);
        }

        .download-button:active {
            transform: scale(0.98);
        }


        /* =========================
           LOADING
           ========================= */

        .loading {
            text-align: center;

            padding: 28px 20px;

            color: #d8bfc2;

            line-height: 1.7;
        }


        /* =========================
           ERROR
           ========================= */

        .error {
            padding: 15px;

            border-radius: 12px;

            background:
                rgba(150, 20, 30, 0.22);

            border:
                1px solid rgba(255, 90, 100, 0.25);

            color: #ffdede;

            line-height: 1.5;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 400px) {

            body {
                padding: 22px 12px;
            }

            .header h1 {
                font-size: 30px;
            }

            .card {
                padding: 20px;
                border-radius: 19px;
            }

            .panel-text {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>ComicCraft</h1>

            <p>
                Turn your imagination into an AI-powered comic.
            </p>

        </div>


        <!-- MAIN CARD -->

        <div class="card">

            <div class="card-title">
                ✨ Create Your Story
            </div>


            <!-- FORM -->

            <form id="comicForm">

                <div class="field">

                    <label for="prompt">
                        Story Prompt
                    </label>

                    <textarea
                        id="prompt"
                        name="prompt"
                        placeholder="Example: A brave fox exploring an enchanted forest..."
                        required
                    ></textarea>

                </div>


                <div class="field">

                    <label for="character">
                        Main Character
                    </label>

                    <input
                        type="text"
                        id="character"
                        name="character"
                        placeholder="Example: Kai"
                        required
                    >

                </div>


                <div class="field">

                    <label for="setting">
                        Setting
                    </label>

                    <input
                        type="text"
                        id="setting"
                        name="setting"
                        placeholder="Forest, school, city, space..."
                        required
                    >

                </div>


                <div class="field">

                    <label for="tone">
                        Story Tone
                    </label>

                    <select id="tone" name="tone">

                        <option value="light-hearted">
                            Light-hearted
                        </option>

                        <option value="funny">
                            Funny
                        </option>

                        <option value="dramatic">
                            Dramatic
                        </option>

                        <option value="poetic">
                            Poetic
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="style">
                        Art Style
                    </label>

                    <select id="style" name="style">

                        <option value="anime">
                            Anime
                        </option>

                        <option value="comic-book">
                            Comic Book
                        </option>

                        <option value="pixel-art">
                            Pixel Art
                        </option>

                        <option value="realistic">
                            Realistic
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="generate-button"
                    id="generateButton"
                >
                    ✨ Create My Comic
                </button>

            </form>


            <!-- GENERATED COMIC -->

            <div id="comicResult"></div>


            <!-- PDF -->

            <a
                id="downloadPdf"
                class="download-button"
                style="display: none;"
            >
                📄 Download Comic PDF
            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            ComicCraft • AI-powered storytelling
        </div>

    </div>


    <script>

        const form =
            document.getElementById("comicForm");

        const result =
            document.getElementById("comicResult");

        const downloadPdf =
            document.getElementById("downloadPdf");

        const generateButton =
            document.getElementById("generateButton");


        function escapeHTML(text) {

            if (text === null || text === undefined) {
                return "";
            }

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                downloadPdf.style.display = "none";


                result.innerHTML = `
                    <div class="loading">
                        ✨ Creating your comic...
                        <br>
                        <small>
                            This may take a little while while
                            the story and images are generated.
                        </small>
                    </div>
                `;


                generateButton.disabled = true;

                generateButton.textContent =
                    "Creating Comic...";


                const formData =
                    new FormData(form);


                try {

                    const response =
                        await fetch(
                            "/generate",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Comic generation failed."
                        );

                    }


                    const data =
                        await response.json();


                    const panels =
                        data.panels;


                    if (
                        !panels ||
                        panels.length === 0
                    ) {

                        throw new Error(
                            "No comic panels were returned."
                        );

                    }


                    if (data.pdf) {

                        downloadPdf.href =
                            data.pdf;

                        downloadPdf.download =
                            "ComicCraft-Comic.pdf";

                        downloadPdf.style.display =
                            "block";

                    }


                    result.innerHTML = "";


                    panels.forEach(
                        function(panel) {

                            const panelElement =
                                document.createElement(
                                    "div"
                                );


                            panelElement.className =
                                "comic-panel";


                            panelElement.innerHTML = `

                                <h3>
                                    Panel ${escapeHTML(panel.panel)}
                                </h3>

                                <img
                                    src="${escapeHTML(panel.image)}"
                                    alt="Comic panel ${escapeHTML(panel.panel)}"
                                    class="comic-image"
                                    loading="lazy"
                                >

                                <div class="panel-text narration-box">

                                    <strong>
                                        Narration
                                    </strong>

                                    ${escapeHTML(panel.narration)}

                                </div>


                                <div class="panel-text dialogue-box">

                                    <strong>
                                        Dialogue
                                    </strong>

                                    ${escapeHTML(panel.dialogue)}

                                </div>

                            `;


                            result.appendChild(
                                panelElement
                            );

                        }
                    );

                }


                catch (error) {

                    console.error(error);


                    result.innerHTML = `

                        <div class="error">

                            ❌
                            ${escapeHTML(
                                error.message ||
                                "Something went wrong while creating the comic."
                            )}

                        </div>

                    `;

                }


                finally {

                    generateButton.disabled =
                        false;

                    generateButton.textContent =
                        "✨ Create My Comic";

                }

            }
        );

    </script>

</body>

</html>
